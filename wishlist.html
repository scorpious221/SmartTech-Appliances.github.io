<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist — SmartTech Appliances</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet"><link href="shop.css" rel="stylesheet"><link href="pages.css" rel="stylesheet">
</head><body data-page="wishlist">
<main id="main" class="container-xxl px-lg-5 pg">
  <h1>My wishlist</h1><p class="sub">Items you’ve hearted. Saved in this browser.</p>
  <div id="product-grid"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.js"></script>
<script src="products-data.js"></script>
<script src="products.js"></script>

<script>
(function () {
  let wish = []; try { wish = JSON.parse(localStorage.getItem('st_wishlist')) || []; } catch (e) {}
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function draw() {
    const list = wish.map(findProduct).filter(Boolean);
    $('#product-grid').html(list.length ? list.map(p => `<article class="product-card"><div class="img"><button class="wish-btn" data-rm="${esc(p.id)}" aria-label="Remove ${esc(p.name)} from wishlist"><i class="bi bi-heart-fill" style="color:var(--st-clay)"></i></button><img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none'"></div><div class="card-body-st"><span class="product-sub">${esc(p.sub)}</span><h3 class="product-name">${esc(p.name)}</h3><div class="price-row"><span class="product-price">₱${p.price.toLocaleString()}</span></div><div class="product-actions"><button class="btn-add" data-add="${esc(p.id)}">Add to Cart</button><a class="btn-buy d-grid align-items-center text-center text-decoration-none" href="products.html?product=${encodeURIComponent(p.id)}">View details</a></div></div></article>`).join('') :
      '<div class="empty"><span class="e-ico"><i class="bi bi-heart"></i></span><h3>Your wishlist is empty</h3><p>Tap the heart on any product to save it here.</p><a class="btn-clay d-inline-grid align-items-center text-decoration-none" href="products.html">Browse products</a></div>');
  }
  $(document).on('click', '[data-rm]', function () {
    const id = $(this).data('rm');
    wish = wish.filter(i => i !== id);
    try { localStorage.setItem('st_wishlist', JSON.stringify(wish)); } catch (e) {}
    draw();
  }).on('click', '.btn-add', function () {
    if (!localStorage.getItem('st_session')) return;
    const p = findProduct($(this).data('add')); if (!p) return;
    $('#toast').html(`<span class="t-ico"><i class="bi bi-check2"></i></span><div class="t-txt"><b>Added to your cart</b><small>${esc(p.name)}</small></div><a class="btn-clay d-grid align-items-center text-decoration-none" style="height:44px" href="cart.html">View cart</a>`).addClass('show');
    setTimeout(() => $('#toast').removeClass('show'), 3500);
  });
  window.renderProducts = draw;
  draw();
})();
</script>
<script src="search.js"></script>
</body></html>
