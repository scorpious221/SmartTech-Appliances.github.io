<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in / Register — SmartTech Appliances</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet"><link href="shop.css" rel="stylesheet"><link href="pages.css" rel="stylesheet">
<style>
.au{max-width:480px;margin:0 auto;transition:max-width .25s}.au.wide{max-width:720px}
.au-head{text-align:center;margin-bottom:24px}.au-head h1{font-size:38px;margin:14px 0 8px}.au-head .sub{margin:0 auto}
.au .seg{display:grid;grid-template-columns:1fr 1fr}.au .seg button{text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.g2 .full{grid-column:1/-1}
.field select{display:block;width:100%;margin-top:6px;border:1px solid var(--st-sand);border-radius:12px;padding:14px;font-size:15px;font-weight:400;background:#fff}
.field select:focus{outline:2px solid var(--st-clay);border-color:var(--st-clay)}
.au .btn-clay{width:100%;margin-top:4px}
.au-note{text-align:center;font-size:12px;color:var(--st-ink-2);margin:20px 0 0}
@media(max-width:575.98px){.g2{grid-template-columns:1fr}.au-head h1{font-size:30px}}
body.au-page{
  background:
    linear-gradient(90deg, rgba(10,31,26,.9) 0%, rgba(10,31,26,.45) 100%),
    url("images/Hero.png") center / cover no-repeat,
    var(--st-ink);
}
@media(min-width:992px){body.au-page{background-attachment:fixed}}
.au-page .au-head h1{color:var(--st-cream)}
.au-page .au-head .sub{color:var(--st-sand)}
.au-page .au-note{color:var(--st-mist)}
.au-page .panel{box-shadow:0 24px 60px rgba(0,0,0,.35);border-color:transparent}
</style></head>
<body data-page="login" class="au-page">
<main id="main" class="container-xxl px-lg-5 pg">
<div class="au" id="au">
  <div class="au-head"><span class="shop-pill">SMARTTECH ACCOUNT</span><h1 id="t">Welcome back</h1><p class="sub" id="s">Log in to view your profile, orders and wishlist.</p></div>
  <div class="panel">
    <div class="seg" role="tablist"><button type="button" role="tab" id="tl" aria-selected="true">Log in</button><button type="button" role="tab" id="tr" aria-selected="false">Register</button></div>
    <form id="fl" novalidate>
      <label class="field">Username<input id="lu" autocomplete="username"></label>
      <label class="field">Password<input id="lp" type="password" autocomplete="current-password"></label>
      <button class="btn-clay" type="submit">Log in</button>
    </form>
    <form id="fr" novalidate hidden>
      <div class="g2">
        <label class="field">Username<input id="ru" autocomplete="username"></label>
        <label class="field">Email<input id="re" type="email" autocomplete="email"></label>
        <label class="field full">Password (at least 6 characters)<input id="rp" type="password" autocomplete="new-password"></label>
        <label class="field full">Full name<input id="rn" autocomplete="name"></label>
        <label class="field">Age<input id="ra" type="number" min="1" max="120" inputmode="numeric"></label>
        <label class="field">Sex<select id="rs"><option value="" selected disabled>Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
        <label class="field">Birthday<input id="rb" type="date"></label>
        <label class="field">Contact number<input id="rc" type="tel" inputmode="numeric" placeholder="09123456789" autocomplete="tel"></label>
        <label class="field full">Address<input id="rd" autocomplete="street-address" placeholder="House no., street, barangay, city"></label>
      </div>
      <button class="btn-clay" type="submit">Create account</button>
    </form>
    <p id="msg" class="msg" role="status" aria-live="polite" style="text-align:center;margin-top:16px"></p>
  </div>
  <p class="au-note">Demo account: saved in this browser only. A real database will replace this storage.</p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const K = u => 'st_user:' + u.toLowerCase();
  const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const find = u => read(K(u)) || (read(u) && read(u).password ? read(u) : null); /* legacy accounts */
  let next = new URLSearchParams(location.search).get('next');
  if (!/^[\w-]+\.html$/.test(next || '')) next = 'index.html';

  const s = localStorage.getItem('st_session');
  if (s && find(s)) { location.replace('profile.html'); return; }

  const msg = (t, ok) => { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); return false; };
  function mode(reg) {
    $('#fl').hidden = reg; $('#fr').hidden = !reg;
    $('#tl').setAttribute('aria-selected', !reg); $('#tr').setAttribute('aria-selected', reg);
    $('#au').classList.toggle('wide', reg);
    $('#t').textContent = reg ? 'Create your account' : 'Welcome back';
  $('#s').textContent = reg ? 'One account for your orders, wishlist and faster checkout.' : 'Log in to view your profile, orders and wishlist.';
    msg('', true);
  }
  $('#tl').onclick = () => mode(false); $('#tr').onclick = () => mode(true);
  if (location.hash === '#register') mode(true);
  $('#rc').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11); });

  $('#fl').onsubmit = e => {
    e.preventDefault();
    const n = $('#lu').value.trim(), p = $('#lp').value;
    if (!n || !p) return msg('Enter your username and password.');
    const u = find(n);
    if (!u) return msg('Username not found.');
    if (u.password !== p) return msg('Incorrect password.');
    localStorage.setItem('st_session', n.toLowerCase());
    msg('Login successful! Welcome back, ' + (u.name || n) + '.', true);
    setTimeout(() => { location.href = next; }, 700);
  };

  $('#fr').onsubmit = e => {
    e.preventDefault();
    const u = { username: $('#ru').value.trim().toLowerCase(), gmail: $('#re').value.trim(), password: $('#rp').value, name: $('#rn').value.trim(), age: $('#ra').value.trim(), sex: $('#rs').value, birthday: $('#rb').value, contact: $('#rc').value.trim(), address: $('#rd').value.trim() };
    if (Object.values(u).some(v => !v)) return msg('Please fill in all fields.');
    if (!/^[a-z0-9_.-]{3,20}$/.test(u.username)) return msg('Username: 3–20 characters (letters, numbers, _ . -).');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(u.gmail)) return msg('Enter a valid email address.');
    if (u.password.length < 6) return msg('Password must be at least 6 characters.');
    if (u.contact.length < 10) return msg('Enter a valid contact number.');
    if (find(u.username)) return msg('Username already exists!');
    try { localStorage.setItem(K(u.username), JSON.stringify(u)); } catch (x) { return msg('Could not save your account. Please try again.'); }
    $('#fr').reset(); mode(false); $('#lu').value = u.username; msg('Account created! You can now log in.', true);
  };
})();
</script>
<script src="search.js"></script>
</body></html>
