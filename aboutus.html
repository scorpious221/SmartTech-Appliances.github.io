<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About Us - SmartTech Appliances</title>


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

</head>


<body>


  <header>

    <div class="header-left">

      <a href="homepage.html">

        <img
          src="images/logo.svg"
          class="logo"
          alt="SmartTech Appliances Logo"
        >

      </a>


      <!-- Home Page -->

      <a
        href="homepage.html"
        class="home-btn btn home-link text-decoration-none"
      >

        Home Page

      </a>

    </div>


    <div class="text-end">

      <h2 style="margin:0;">

        SmartTech Appliances

      </h2>

      <small>

        "Where Innovation Meets Everyday Living."

      </small>

    </div>

  </header>



  <section class="background">


    <div class="text">

      <h1>

        About Us

      </h1>

      <div class="title-bar"></div>

    </div>



    <div class="bottom-box">


      <div class="buttons">

        <button
          class="active"
          onclick="switchTab('team', this)"
        >

          Our Team

        </button>


        <button
          onclick="switchTab('location', this)"
        >

          Our Location

        </button>


        <button
          onclick="switchTab('contact', this)"
        >

          Contact Us

        </button>

      </div>



      <!-- OUR TEAM -->

      <div
        id="team"
        class="tab-content active"
      >

        <h2 class="section-title">

          Our Team

        </h2>


        <div class="team-section">


          <div class="team-member">

            <img
              src="images/Aboga.jpg"
              alt="Aboga"
            >

            <p>

              Aboga

            </p>

          </div>



          <div class="team-member">

            <img
              src="images/castaneda.png"
              alt="Castaneda"
            >

            <p>

              Castaneda

            </p>

          </div>



          <div class="team-member">

            <img
              src="images/navarro.jpg"
              alt="Navarro"
            >

            <p>

              Navarro

            </p>

          </div>



          <div class="team-member">

            <img
              src="images/santos.png"
              alt="Santos"
            >

            <p>

              Santos

            </p>

          </div>



          <div class="team-member">

            <img
              src="images/Valonda.jpg"
              alt="Valonda"
            >

            <p>

              Valonda

            </p>

          </div>


        </div>

      </div>



      <!-- OUR LOCATION -->

      <div
        id="location"
        class="tab-content"
      >

        <h2 class="section-title">

          Our Location

        </h2>


        <div class="map-section">


          <div>

            <p>

              <strong>

                SmartTech Appliances

              </strong>

            </p>


            <p>

              Quezon City, Metro Manila<br>

              Philippines

            </p>


            <p>

              +63 992 001 1520

            </p>

          </div>



          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3860.5310646720527!2d121.05914151000712!3d14.625768976402338!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397b796aecb8763%3A0xaa026ea7350f82e7!2sTechnological%20Institute%20of%20the%20Philippines%20-%20Quezon%20City!5e0!3m2!1sen!2sph!4v1761917559782!5m2!1sen!2sph"
            allowfullscreen
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>


        </div>

      </div>



      <!-- CONTACT US -->

      <div
        id="contact"
        class="tab-content"
      >

        <h2 class="section-title">

          Contact Us

        </h2>


        <form class="form-section">


          <input
            type="text"
            placeholder="Name"
            required
          >


          <input
            type="email"
            placeholder="Email"
            required
          >


          <input
            type="tel"
            placeholder="Phone number"
            required
          >


          <textarea
            placeholder="Message"
            required
          ></textarea>


          <button type="submit">

            Send

          </button>


        </form>

      </div>


    </div>

  </section>



  <footer>

    © 2026 SmartTech Appliances. All rights reserved.

  </footer>



  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <script>

    function switchTab(tabId, button) {

      document
        .querySelectorAll('.tab-content')
        .forEach(sec => sec.classList.remove('active'));


      document
        .querySelectorAll('.buttons button')
        .forEach(btn => btn.classList.remove('active'));


      document
        .getElementById(tabId)
        .classList.add('active');


      button.classList.add('active');

    }

  </script>


</body>

</html>
