<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help & FAQs — SmartTech Appliances</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet"><link href="shop.css" rel="stylesheet"><link href="pages.css" rel="stylesheet">
</head><body data-page="help">
<main id="main" class="container-xxl px-lg-5 pg">
  <h1>Help center</h1><p class="sub">Delivery, returns, payment and frequently asked questions, all in one place.</p>
  <div id="groups"></div>
  <div class="panel">Can’t find your answer? <a href="about.html#contact"><b>Contact us</b></a>.</div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.js"></script>
<script>
var G = [
 ['delivery','Delivery information',[['How much is shipping?','Delivery is free on orders over ₱3,000. For smaller orders, a flat ₱150 shipping fee applies.'],['How long does delivery take?','Usually 2–5 days in Metro Manila and 5–10 days in other parts of the Philippines.'],['How do I know where my order is?','Use the Track my order page and enter the order number from your receipt.']]],
 ['returns','Returns & warranty',[['Do the products come with a warranty?','Yes, every product comes with a 1-year warranty.'],['Can I return an item?','Yes, 30-day returns as long as the product is intact and the packaging and receipt are complete.'],['How do I claim the warranty?','Bring or send the item with your receipt. We will repair or replace it if it is covered by the warranty.']]],
 ['payment','Payment options',[['What payment methods do you accept?','GCash, Maya, credit/debit card (Visa, Mastercard) and Cash on Delivery.'],['Is payment safe?','We do not save your card details in the browser. You can also choose Cash on Delivery.']]],
 ['faq','FAQs',[['Do I need to create an account?','Yes. You need to log in or register before you can add items to your cart and check out. An account also lets you view your profile, orders and wishlist in one place.'],['What if the item I want is out of stock?','Click Notify Me on the product card and we will let you know when it is back in stock.']]]
];
$('#groups').html($.map(G, function (g) {
  var id = g[0];
  return '<section class="help-group" id="' + id + '"><h2>' + g[1] + '</h2><div class="accordion">' + $.map(g[2], function (qa, i) {
    return '<div class="accordion-item"><h3 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#' + id + i + '" aria-expanded="false" aria-controls="' + id + i + '">' + qa[0] + '</button></h3><div id="' + id + i + '" class="accordion-collapse collapse"><div class="accordion-body">' + qa[1] + '</div></div></div>';
  }).join('') + '</div></section>';
}).join(''));
</script>
<script src="search.js"></script>
</body></html>
