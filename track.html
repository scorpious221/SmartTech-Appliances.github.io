<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track my order — SmartTech Appliances</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet"><link href="shop.css" rel="stylesheet"><link href="pages.css" rel="stylesheet">
</head><body data-page="track">
<main id="main" class="container-xxl px-lg-5 pg">
  <h1>Track my order</h1><p class="sub">Enter the order number from your receipt (e.g. ORD-123456).</p>
  <div class="panel" style="max-width:640px">
    <form id="f" novalidate><label class="field">Order number<input id="ord" placeholder="ORD-123456" autocomplete="off"></label>
    <p id="msg" class="msg" role="status" aria-live="polite"></p><button class="btn-clay" type="submit">Track order</button></form>
  </div>
  <div id="result" class="mt-4" style="max-width:640px"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read = (k, f) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? f : v; } catch (e) { return f; } };
  const orders = read('st_orders', []), last = read('lastOrder', null);
  if (last && last.orderNumber) $('#ord').value = last.orderNumber;
  const S = [['Pending','Order placed','We have received your order.'],['Processing','Processing','Your items are being prepared.'],['Shipped','Out for delivery','Your order is on its way.'],['Delivered','Delivered','Your order has been delivered.']];

  $('#f').onsubmit = e => {
    e.preventDefault();
    const v = $('#ord').value.trim().toUpperCase();
    if (!v) { $('#msg').className = 'msg err'; $('#msg').textContent = 'Enter your order number.'; return; }
    let order = orders.find(o => String(o.orderNumber).toUpperCase() === v);
    if (!order && last && String(last.orderNumber).toUpperCase() === v) order = last;
    if (!order) { $('#msg').className = 'msg err'; $('#msg').textContent = 'We couldn’t find this order. Check the number or contact us.'; $('#result').innerHTML = ''; return; }
    $('#msg').textContent = '';
    const status = order.status || 'Pending';
    let current = S.findIndex(s => s[0] === status); if (current < 0) current = 0;
    $('#result').innerHTML = `<div class="panel"><b>${esc(order.orderNumber)}</b> · ${esc(order.paymentMethod)} · ₱${Number(order.grandTotal).toLocaleString()}<p style="margin:8px 0 0;color:var(--st-ink-2)">Status: <b style="color:var(--st-clay)">${esc(status)}</b></p><ol class="steps">${S.map((s, i) => `<li class="${i <= current ? 'done' : ''}"><b>${s[1]}</b>${s[2]}</li>`).join('')}</ol><small style="color:var(--st-ink-2)">Delivering to: ${esc(order.address)}</small></div>`;
  };
})();
</script>
<script src="search.js"></script>
</body></html>
