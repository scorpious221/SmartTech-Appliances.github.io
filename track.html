<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track my order — SmartTech Appliances</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet"><link href="shop.css" rel="stylesheet"><link href="pages.css" rel="stylesheet">
</head><body data-page="track">
<main id="main" class="container-xxl px-lg-5 pg">
  <h1>Track my order</h1><p class="sub">I-type ang order number mula sa resibo mo (hal. ORD-123456).</p>
  <div class="panel" style="max-width:640px">
    <form id="f" novalidate><label class="field">Order number<input id="ord" placeholder="ORD-123456" autocomplete="off"></label>
    <p id="msg" class="msg" role="status" aria-live="polite"></p><button class="btn-clay" type="submit">Track order</button></form>
  </div>
  <div id="result" class="mt-4" style="max-width:640px"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="layout.js"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let last = null; try { last = JSON.parse(localStorage.getItem('lastOrder')); } catch (e) {}
  if (last) $('#ord').value = last.orderNumber;
  $('#f').onsubmit = e => {
    e.preventDefault();
    const v = $('#ord').value.trim().toUpperCase();
    if (!v) { $('#msg').className = 'msg err'; $('#msg').textContent = 'Enter your order number.'; return; }
    if (!last || last.orderNumber !== v) { $('#msg').className = 'msg err'; $('#msg').textContent = 'Hindi namin mahanap ang order na ito sa browser na ito. Check ang number o makipag-ugnayan sa amin.'; $('#result').innerHTML = ''; return; }
    $('#msg').textContent = '';
    /* Demo: status batay sa oras mula nang um-order. Palitan ng totoong data kapag may backend. */
    const hrs = (Date.now() - new Date(last.orderDate).getTime()) / 36e5, st = hrs < 2 ? 0 : hrs < 24 ? 1 : hrs < 72 ? 2 : 3;
    const S = [['Order placed','Natanggap na namin ang order mo.'],['Packed','Inihahanda na ang mga item.'],['Out for delivery','Papunta na sa address mo.'],['Delivered','Naihatid na.']];
    $('#result').innerHTML = `<div class="panel"><b>${esc(last.orderNumber)}</b> · ${esc(last.paymentMethod)} · ₱${Number(last.grandTotal).toLocaleString()}<ol class="steps">${S.map((s, i) => `<li class="${i <= st ? 'done' : ''}"><b>${s[0]}</b>${s[1]}</li>`).join('')}</ol><small style="color:var(--st-ink-2)">Ihahatid sa: ${esc(last.address)}</small></div>`;
  };
})();
</script>
<script src="search.js"></script>
</body></html>
